name: Build and deploy sandbox

on:
  push:
    branches:
      - "sandbox"
  workflow_call:

jobs:
  build:
    name: "build"
    permissions:
      contents: "read"
      id-token: "write"
      packages: "write"
    runs-on: "ubuntu-latest"
    outputs:
      image: "${{ steps.docker-push.outputs.image }}"
      telemetry: "${{ steps.docker-push.outputs.telemetry }}"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          ref: sandbox
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: '11.9.0'
      - uses: "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:ci
      - run: pnpm run build
      - run: pnpm prune --prod --ignore-scripts
      - uses: nais/docker-build-push@31c3a7321909bcb20799fdf46153fec721fd9512 # v0
        id: docker-push
        with:
          team: pensjon-saksbehandling

  deploy:
    permissions:
      contents: "read"
      id-token: "write"
    needs: [build]
    runs-on: 'ubuntu-latest'

    strategy:
      matrix:
        include:
          -  vars_file: vars-q2.yaml
             cluster: dev-gcp

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: sandbox
      - uses: nais/deploy/actions/deploy@2d18f050f07b6a007864c6a57070ed915d571beb # v2, https://github.com/nais/deploy/commit/2d18f050f07b6a007864c6a57070ed915d571beb
        name: "deploy"
        env:
          CLUSTER: '${{ matrix.cluster }}'
          IMAGE: "${{ needs.build.outputs.image }}"
          RESOURCE: .nais/nais.yaml,.nais/unleash-apitoken.yaml
          TELEMETRY: ${{ needs.build.outputs.telemetry }}
          VARS: '.nais/${{ matrix.vars_file }}'
