name: Build and deploy sandbox

on:
  push:
    branches:
      - "sandbox"
  workflow_call:

jobs:
  build:
    name: "build"
    permissions:
      contents: "read"
      id-token: "write"
      packages: "write"
    runs-on: "ubuntu-latest"
    outputs:
      image: "${{ steps.docker-push.outputs.image }}"
      telemetry: "${{ steps.docker-push.outputs.telemetry }}"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          ref: sandbox
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: 'package.json'
      - uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:ci
      - run: pnpm run build
      - run: pnpm prune --prod --ignore-scripts
      - uses: nais/docker-build-push@8e41f1f58749b9248e376c25d33bfbdd2b1163c0 # v0
        id: docker-push
        with:
          team: pensjon-saksbehandling

  deploy:
    permissions:
      contents: "read"
      id-token: "write"
    needs: [build]
    runs-on: 'ubuntu-latest'

    strategy:
      matrix:
        include:
          -  vars_file: vars-q2.yaml
             cluster: dev-gcp

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: sandbox
      - uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199 # v2
        name: "deploy"
        env:
          CLUSTER: '${{ matrix.cluster }}'
          IMAGE: "${{ needs.build.outputs.image }}"
          RESOURCE: .nais/nais.yaml,.nais/unleash-apitoken.yaml
          TELEMETRY: ${{ needs.build.outputs.telemetry }}
          VARS: '.nais/${{ matrix.vars_file }}'

  build-pdf:
    name: "build-pdf"
    permissions:
      contents: "read"
      id-token: "write"
      packages: "write"
    runs-on: "ubuntu-latest"
    outputs:
      image: "${{ steps.docker-push.outputs.image }}"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          ref: sandbox
      - uses: nais/docker-build-push@2d2b0a7193e65422b7f0355d4afb445e0a8b2cc3 # v0
        id: docker-push
        with:
          team: pensjon-saksbehandling
          dockerfile: pdf/Dockerfile
          docker_context: .
          image_suffix: pdf

  deploy-pdf:
    permissions:
      contents: "read"
      id-token: "write"
    needs: [build-pdf]
    runs-on: 'ubuntu-latest'

    strategy:
      matrix:
        include:
          -  vars_file: vars-q2.yaml
             cluster: dev-fss

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: sandbox
      - uses: nais/deploy/actions/deploy@2d18f050f07b6a007864c6a57070ed915d571beb # v2
        name: "deploy-pdf"
        env:
          CLUSTER: '${{ matrix.cluster }}'
          IMAGE: "${{ needs.build-pdf.outputs.image }}"
          RESOURCE: pdf/nais/nais.yaml
          VARS: 'pdf/nais/${{ matrix.vars_file }}'
