name: Build and deploy sandbox

on:
  push:
    branches:
      - "sandbox"
  workflow_call:

jobs:
  build:
    name: "build"
    permissions:
      contents: "read"
      id-token: "write"
      packages: "write"
    runs-on: "ubuntu-latest"
    outputs:
      image: "${{ steps.docker-push.outputs.image }}"
      telemetry: "${{ steps.docker-push.outputs.telemetry }}"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          ref: sandbox
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: 'package.json'
      - uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1" # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:ci
      - run: pnpm run build
      - run: pnpm prune --prod --ignore-scripts
      - uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 # v0
        id: docker-push
        with:
          team: pensjon-saksbehandling

  deploy:
    permissions:
      contents: "read"
      id-token: "write"
    needs: [build]
    runs-on: 'ubuntu-latest'

    strategy:
      matrix:
        include:
          -  vars_file: vars-q2.yaml
             cluster: dev-gcp

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: sandbox
      - uses: nais/deploy/actions/deploy@d003bddf74ce5b96fa3056ae60bd4b9b3bbc89ef # v3
        name: "deploy"
        env:
          CLUSTER: '${{ matrix.cluster }}'
          IMAGE: "${{ needs.build.outputs.image }}"
          RESOURCE: .nais/nais.yaml,.nais/unleash-apitoken.yaml
          TELEMETRY: ${{ needs.build.outputs.telemetry }}
          VARS: '.nais/${{ matrix.vars_file }}'

  build-pdf:
    name: "build-pdf"
    permissions:
      contents: "read"
      id-token: "write"
      packages: "write"
    runs-on: "ubuntu-latest"
    outputs:
      image: "${{ steps.docker-push.outputs.image }}"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          ref: sandbox
      - uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 # v0
        id: docker-push
        with:
          team: pensjon-saksbehandling
          dockerfile: pdf/Dockerfile
          docker_context: .
          image_suffix: pdf

  deploy-pdf:
    permissions:
      contents: "read"
      id-token: "write"
    needs: [build-pdf]
    runs-on: 'ubuntu-latest'

    strategy:
      matrix:
        include:
          -  vars_file: vars-q2.yaml
             cluster: dev-fss

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: sandbox
      - uses: nais/deploy/actions/deploy@d003bddf74ce5b96fa3056ae60bd4b9b3bbc89ef # v3
        name: "deploy-pdf"
        env:
          CLUSTER: '${{ matrix.cluster }}'
          IMAGE: "${{ needs.build-pdf.outputs.image }}"
          RESOURCE: pdf/nais/nais.yaml
          VARS: 'pdf/nais/${{ matrix.vars_file }}'
