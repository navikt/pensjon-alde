name: PDF-integrasjonstest

on:
  workflow_dispatch:

concurrency:
  group: pdf-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdf-integration:
    name: "pdf-integration"
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: 'package.json'
      - uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1" # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: nais/login@40b72a35a18ddf2ad74b632461139ab838cc2a2f # v0
        with:
          team: pensjon-saksbehandling
      - name: Bruk standard Docker-builder slik at imagene lastes lokalt
        run: docker buildx use default
      - run: pnpm test:pdf-integration
        env:
          PDF_PULL: '1'
