# Pakker må være minst 7 dager gamle før de lastes ned
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@navikt/*"

allowBuilds:
  esbuild: true
  lefthook: true
  msw: true

# Hindrer at `pnpm update --latest` drar @types/node forbi major 24
updateConfig:
  ignoreDependencies:
    - "@types/node"
