apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  labels:
    "team": "{{{ app.namespace }}}"
  name: "{{{ app.name }}}"
  namespace: "{{{ app.namespace }}}"
spec:
  image: "{{{ image }}}"

  port: 8090

  env:
    - name: PDF_PORT
      value: "8090"

  liveness:
    path: '/internal/live'
    initialDelay: 5
    timeout: 1
    periodSeconds: 5
    failureThreshold: 10

  readiness:
    path: '/internal/ready'
    initialDelay: 5
    timeout: 1

  replicas:
    min: 2
    max: 2

  resources:
    limits:
      memory: "2Gi"
    requests:
      cpu: "200m"
      memory: "512Mi"
