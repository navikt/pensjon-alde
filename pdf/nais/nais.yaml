apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  labels:
    "team": "{{{ app.namespace }}}"
  name: "{{{ app.name }}}"
  namespace: "{{{ app.namespace }}}"
spec:
  image: "{{{ image }}}"

  accessPolicy:
    inbound:
      rules:
        - application: "{{{ pen.application }}}"
          namespace: "{{{ pen.namespace }}}"

  port: 8090

  prometheus:
    enabled: true
    path: '/metrics'
    port: '8090'

  observability:
    autoInstrumentation:
      enabled: true
      runtime: 'nodejs'

  env:
    - name: PDF_PORT
      value: "8090"
    - name: PDF_RENDER_TIMEOUT_MS
      value: "30000"

  liveness:
    path: '/internal/live'
    initialDelay: 5
    timeout: 1
    periodSeconds: 5
    failureThreshold: 10

  readiness:
    path: '/internal/ready'
    initialDelay: 5
    timeout: 1

  replicas:
    min: 2
    max: 6
    scalingStrategy:
      cpu:
        thresholdPercentage: 70

  resources:
    limits:
      memory: "2Gi"
    requests:
      cpu: "500m"
      memory: "512Mi"
